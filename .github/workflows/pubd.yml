name: Build & Release CloudDrop APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Nhãn phiên bản phát hành (ví dụ: v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_name:
        description: 'Tiêu đề bản phát hành'
        required: false
        default: ''
      prerelease:
        description: 'Đánh dấu là bản thử nghiệm (pre-release)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Thiết lập Android SDK
        uses: android-actions/setup-android@v3

      - name: Thiết lập Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Đồng bộ chữ ký APK (Keystore)
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "${{ github.workspace }}/my-upload-key.jks"
            echo "mode=release" >> "$GITHUB_OUTPUT"
            echo "task=assembleRelease" >> "$GITHUB_OUTPUT"
            echo "apk_path=app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_OUTPUT"
            echo "Đã giải mã release keystore (my-upload-key.jks) khớp signingConfigs.release."
          elif [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "${{ github.workspace }}/debug.keystore"
            echo "mode=debug-synced" >> "$GITHUB_OUTPUT"
            echo "task=assembleDebug" >> "$GITHUB_OUTPUT"
            echo "apk_path=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"
            echo "Đã giải mã debug keystore đồng bộ (debug.keystore) từ GitHub Secret."
          elif [ -f "${{ github.workspace }}/debug.keystore.base64" ]; then
            base64 --decode "${{ github.workspace }}/debug.keystore.base64" > "${{ github.workspace }}/debug.keystore"
            echo "mode=debug-synced" >> "$GITHUB_OUTPUT"
            echo "task=assembleDebug" >> "$GITHUB_OUTPUT"
            echo "apk_path=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"
            echo "Đã giải mã debug.keystore từ debug.keystore.base64 trong repo."
          elif [ -f "${{ github.workspace }}/debug.keystore" ]; then
            echo "mode=debug-synced" >> "$GITHUB_OUTPUT"
            echo "task=assembleDebug" >> "$GITHUB_OUTPUT"
            echo "apk_path=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"
            echo "Sử dụng debug.keystore có sẵn trong repo để giữ nguyên chữ ký cài đè."
          else
            echo "::error::Chưa cấu hình chữ ký APK đồng bộ! Vui lòng thêm GitHub Secrets KEYSTORE_BASE64, STORE_PASSWORD, KEY_PASSWORD (khớp alias 'upload') hoặc DEBUG_KEYSTORE_BASE64."
            exit 1
          fi

      - name: Biên dịch APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle --no-daemon :app:${{ steps.signing.outputs.task }}

      - name: Kiểm tra chữ ký APK & đổi tên tệp phát hành
        id: package
        shell: bash
        run: |
          TAG_NAME="${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}"
          CLEAN_TAG="${TAG_NAME#refs/tags/}"
          SRC_APK="${{ steps.signing.outputs.apk_path }}"
          OUT_DIR="release-artifacts"
          mkdir -p "$OUT_DIR"
          OUT_APK="$OUT_DIR/CloudDrop-${CLEAN_TAG}.apk"
          cp "$SRC_APK" "$OUT_APK"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$OUT_APK"
          fi

          SHA256="$(sha256sum "$OUT_APK" | awk '{print $1}')"
          echo "tag=$CLEAN_TAG" >> "$GITHUB_OUTPUT"
          echo "apk_file=$OUT_APK" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Đăng APK lên GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package.outputs.tag }}
          name: ${{ inputs.release_name != '' && inputs.release_name || format('CloudDrop {0}', steps.package.outputs.tag) }}
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
          body: |
            ### Bản phát hành CloudDrop `${{ steps.package.outputs.tag }}`
            - **Chế độ chữ ký:** `${{ steps.signing.outputs.mode }}` (đồng bộ keystore, hỗ trợ cài đè nâng cấp)
            - **SHA-256 APK:** `${{ steps.package.outputs.sha256 }}`
          files: |
            ${{ steps.package.outputs.apk_file }}

      - name: Dọn dẹp keystore tạm
        if: always()
        run: |
          rm -f "${{ github.workspace }}/my-upload-key.jks"
