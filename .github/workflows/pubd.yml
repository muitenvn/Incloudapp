name: Build and Release CloudDrop APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (vd: v1.0.1, de trong de tu tao)'
        required: false
        default: ''
      prerelease:
        description: 'Danh dau ban thu nghiem (pre-release)'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          SDK_MANAGER=""
          for candidate in \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -maxdepth 4 -name sdkmanager 2>/dev/null | head -n 1)"; do
            if [ -n "$candidate" ] && [ -x "$candidate" ]; then
              SDK_MANAGER="$candidate"
              break
            fi
          done
          if [ -n "$SDK_MANAGER" ]; then
            yes | "$SDK_MANAGER" --licenses > /dev/null 2>&1 || true
          fi

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Restore cached signing keystore
        uses: actions/cache@v4
        with:
          path: .signing-cache/debug.keystore
          key: clouddrop-debug-keystore-v1

      - name: Sync APK signing keystore
        id: signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | tr -d '\r\n' | base64 --decode > "${GITHUB_WORKSPACE}/my-upload-key.jks"
            echo "mode=release" >> "$GITHUB_OUTPUT"
            echo "task=assembleRelease" >> "$GITHUB_OUTPUT"
            echo "apk_path=app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_OUTPUT"
            echo "Using release keystore (my-upload-key.jks)."
          elif [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | tr -d '\r\n' | base64 --decode > "${GITHUB_WORKSPACE}/debug.keystore"
            echo "mode=debug-secret-synced" >> "$GITHUB_OUTPUT"
            echo "task=assembleDebug" >> "$GITHUB_OUTPUT"
            echo "apk_path=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"
            echo "Using synced debug.keystore from DEBUG_KEYSTORE_BASE64 secret."
          elif [ -f "${GITHUB_WORKSPACE}/debug.keystore.base64" ]; then
            tr -d '\r\n' < "${GITHUB_WORKSPACE}/debug.keystore.base64" | base64 --decode > "${GITHUB_WORKSPACE}/debug.keystore"
            echo "mode=debug-repo-synced" >> "$GITHUB_OUTPUT"
            echo "task=assembleDebug" >> "$GITHUB_OUTPUT"
            echo "apk_path=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"
            echo "Using synced debug.keystore decoded from debug.keystore.base64."
          elif [ -f "${GITHUB_WORKSPACE}/debug.keystore" ]; then
            echo "mode=debug-repo-synced" >> "$GITHUB_OUTPUT"
            echo "task=assembleDebug" >> "$GITHUB_OUTPUT"
            echo "apk_path=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"
            echo "Using existing debug.keystore in repository."
          elif [ -f "${GITHUB_WORKSPACE}/.signing-cache/debug.keystore" ]; then
            cp "${GITHUB_WORKSPACE}/.signing-cache/debug.keystore" "${GITHUB_WORKSPACE}/debug.keystore"
            echo "mode=debug-cache-synced" >> "$GITHUB_OUTPUT"
            echo "task=assembleDebug" >> "$GITHUB_OUTPUT"
            echo "apk_path=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"
            echo "Using cached debug.keystore to keep APK signature synchronized across builds."
          else
            mkdir -p "${GITHUB_WORKSPACE}/.signing-cache"
            keytool -genkeypair -v \
              -keystore "${GITHUB_WORKSPACE}/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=CloudDrop,OU=Mobile,O=CloudDrop,L=Hanoi,C=VN"
            cp "${GITHUB_WORKSPACE}/debug.keystore" "${GITHUB_WORKSPACE}/.signing-cache/debug.keystore"
            echo "mode=debug-auto-cached" >> "$GITHUB_OUTPUT"
            echo "task=assembleDebug" >> "$GITHUB_OUTPUT"
            echo "apk_path=app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_OUTPUT"
            echo "::notice::Generated and cached debug.keystore automatically. For permanent cross-year signing, add KEYSTORE_BASE64, STORE_PASSWORD, KEY_PASSWORD in GitHub Secrets."
          fi

      - name: Prepare version tag
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          INPUT_TAG: ${{ inputs.release_tag }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          APP_VER="$(grep -E 'versionName\s*=' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')"
          APP_VER="${APP_VER:-1.0}"

          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_TAG" ]; then
            CLEAN_TAG="$INPUT_TAG"
          elif [ "$REF_TYPE" = "tag" ]; then
            CLEAN_TAG="$REF_NAME"
          else
            CLEAN_TAG="v${APP_VER}-b${RUN_NUMBER}"
          fi

          if [ "$INPUT_PRERELEASE" = "true" ]; then
            IS_PRE="true"
          else
            IS_PRE="false"
          fi

          echo "tag=${CLEAN_TAG}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${IS_PRE}" >> "$GITHUB_OUTPUT"

      - name: Build signed APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle --no-daemon --stacktrace \
            -PUPDATE_REPO="${{ github.repository }}" \
            -PAPP_BUILD_NUMBER="${{ github.run_number }}" \
            -PAPP_BUILD_TAG="${{ steps.version.outputs.tag }}" \
            :app:${{ steps.signing.outputs.task }}

      - name: Verify APK signature and prepare release artifact
        id: package
        shell: bash
        env:
          CLEAN_TAG: ${{ steps.version.outputs.tag }}
          IS_PRE: ${{ steps.version.outputs.prerelease }}
          SRC_APK: ${{ steps.signing.outputs.apk_path }}
        run: |
          OUT_DIR="release-artifacts"
          mkdir -p "$OUT_DIR"
          OUT_APK="${OUT_DIR}/CloudDrop-${CLEAN_TAG}.apk"
          cp "$SRC_APK" "$OUT_APK"

          APKSIGNER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name apksigner 2>/dev/null | sort -V | tail -n 1)"
          CERT_SHA256="unknown"
          if [ -n "$APKSIGNER" ]; then
            VERIFY_OUT="$("$APKSIGNER" verify --print-certs "$OUT_APK")"
            echo "$VERIFY_OUT"
            CERT_SHA256="$(echo "$VERIFY_OUT" | grep -m 1 'certificate SHA-256 digest:' | awk '{print $NF}')"
          fi

          APK_SHA256="$(sha256sum "$OUT_APK" | awk '{print $1}')"

          echo "tag=${CLEAN_TAG}" >> "$GITHUB_OUTPUT"
          echo "release_name=CloudDrop ${CLEAN_TAG}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${IS_PRE}" >> "$GITHUB_OUTPUT"
          echo "apk_file=${OUT_APK}" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=${APK_SHA256}" >> "$GITHUB_OUTPUT"
          echo "cert_sha256=${CERT_SHA256}" >> "$GITHUB_OUTPUT"

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CloudDrop-${{ steps.package.outputs.tag }}
          path: ${{ steps.package.outputs.apk_file }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package.outputs.tag }}
          name: ${{ steps.package.outputs.release_name }}
          prerelease: ${{ steps.package.outputs.prerelease }}
          make_latest: true
          generate_release_notes: true
          body: |
            ### Ban phat hanh CloudDrop `${{ steps.package.outputs.tag }}`
            - **Che do ky APK:** `${{ steps.signing.outputs.mode }}` (dong bo keystore de cai de nang cap)
            - **Chung chi ky (Cert SHA-256):** `${{ steps.package.outputs.cert_sha256 }}`
            - **File APK SHA-256:** `${{ steps.package.outputs.apk_sha256 }}`
          files: ${{ steps.package.outputs.apk_file }}

      - name: Cleanup temporary keystores
        if: always()
        shell: bash
        run: |
          rm -f "${GITHUB_WORKSPACE}/my-upload-key.jks"
          rm -f "${GITHUB_WORKSPACE}/debug.keystore"
