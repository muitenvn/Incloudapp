name: Build & Release InCloud APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Nhãn phiên bản (để trống để tự tạo)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release-apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          SDK_MANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -maxdepth 4 -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -n "$SDK_MANAGER" ]; then
            yes | "$SDK_MANAGER" --licenses > /dev/null 2>&1 || true
          fi

      - name: Restore cached release keystore (if secrets not set)
        uses: actions/cache@v4
        with:
          path: .signing-cache/my-upload-key.jks
          key: incloud-release-keystore-v1

      - name: Prepare Release signing & build APK
        id: build
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          # 1. Determine release tag
          APP_VER="$(grep -E 'versionName\s*=' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')"
          APP_VER="${APP_VER:-1.0}"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
          else
            TAG="v${APP_VER}-b${RUN_NUMBER}"
          fi

          # 2. Prepare Release keystore (always build non-debuggable assembleRelease)
          KEYSTORE_FILE="${GITHUB_WORKSPACE}/my-upload-key.jks"
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | tr -d '\r\n' | base64 --decode > "$KEYSTORE_FILE"
            SIGN_MODE="release-secret"
          else
            export STORE_PASSWORD="incloud-release-key"
            export KEY_PASSWORD="incloud-release-key"
            if [ -f "${GITHUB_WORKSPACE}/.signing-cache/my-upload-key.jks" ]; then
              cp "${GITHUB_WORKSPACE}/.signing-cache/my-upload-key.jks" "$KEYSTORE_FILE"
              SIGN_MODE="release-cached"
            else
              mkdir -p "${GITHUB_WORKSPACE}/.signing-cache"
              keytool -genkeypair -noprompt \
                -keystore "$KEYSTORE_FILE" \
                -storepass "$STORE_PASSWORD" \
                -alias upload \
                -keypass "$KEY_PASSWORD" \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=InCloud,OU=Android,O=InCloud,L=Hanoi,C=VN"
              cp "$KEYSTORE_FILE" "${GITHUB_WORKSPACE}/.signing-cache/my-upload-key.jks"
              SIGN_MODE="release-auto-cached"
            fi
          fi

          # 3. Compile signed Release APK (debuggable=false)
          export KEYSTORE_PATH="$KEYSTORE_FILE"
          gradle --no-daemon \
            -PUPDATE_REPO="${{ github.repository }}" \
            -PAPP_BUILD_NUMBER="${RUN_NUMBER}" \
            -PAPP_BUILD_TAG="${TAG}" \
            :app:assembleRelease

          # 4. Package and verify APK signature
          mkdir -p release-artifacts
          OUT_APK="release-artifacts/InCloud-${TAG}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$OUT_APK"

          APKSIGNER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name apksigner 2>/dev/null | sort -V | tail -n 1)"
          CERT_SHA256="unknown"
          if [ -n "$APKSIGNER" ]; then
            VERIFY_OUT="$("$APKSIGNER" verify --print-certs "$OUT_APK")"
            echo "$VERIFY_OUT"
            CERT_SHA256="$(echo "$VERIFY_OUT" | grep -m 1 'certificate SHA-256 digest:' | awk '{print $NF}')"
          fi
          APK_SHA256="$(sha256sum "$OUT_APK" | awk '{print $1}')"

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "apk_file=${OUT_APK}" >> "$GITHUB_OUTPUT"
          echo "sign_mode=${SIGN_MODE}" >> "$GITHUB_OUTPUT"
          echo "cert_sha256=${CERT_SHA256}" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=${APK_SHA256}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.build.outputs.tag }}
          name: InCloud ${{ steps.build.outputs.tag }}
          make_latest: true
          generate_release_notes: true
          body: |
            ### InCloud `${{ steps.build.outputs.tag }}` (Release APK)
            - **Chế độ ký:** `${{ steps.build.outputs.sign_mode }}` (`debuggable = false`)
            - **Cert SHA-256:** `${{ steps.build.outputs.cert_sha256 }}`
            - **APK SHA-256:** `${{ steps.build.outputs.apk_sha256 }}`
          files: ${{ steps.build.outputs.apk_file }}

      - name: Cleanup temporary keystore
        if: always()
        run: rm -f "${GITHUB_WORKSPACE}/my-upload-key.jks"
